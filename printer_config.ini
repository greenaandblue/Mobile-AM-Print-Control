[printer]
port = /dev/ttyACM0
baud = 115200
wait = true
status_update_interval = 10
auto_arrange = true

[paths]
slicer = prusa-slicer-console
working_dir = .
profile = default_profile.ini

[input_print_files]
stl_file1 = cutbox_rec.stl
stl_file2 = cylinder_20mm.stl

[center_positions]
stl_file1 = 50,50
stl_file2 = 100,100

[rotations]
stl_file1 = 0,0,0
stl_file2 = 90,0,0

[output_print_file]
output_file = print_file.gcode
