[printer]
# 串口端口 (Linux: /dev/ttyACM0 或 /dev/ttyACM1, Windows: COM3 等)
port = /dev/ttyACM0

# 波特率 (常见值: 115200, 250000, 230400)
baud = 115200

# 等待打印完成
wait = true

# 状态更新间隔（秒）
status_update_interval = 10

# 自动排列（如果有多个对象）
auto_arrange = true

[paths]
# Prusa Slicer 的路径 (用于 STL 切片)
slicer = prusa-slicer-console

# 工作目录
working_dir = .

# 打印配置文件 (可选)
profile = 

[output_print_file]
# 输出的 G-code 文件名
output_file = print_file.gcode

[input_print_files]
# 如果需要切片 STL 文件，在此列出 (可选)
# stl_file1 = model1.stl
# stl_file2 = model2.stl

[center_positions]
# 设置对象的中心位置 (可选)
# stl_file1 = 100,100
# stl_file2 = 50,50

[rotations]
# 设置对象的旋转角度 (可选，格式: rx,ry,rz)
# stl_file1 = 0,0,45
# stl_file2 = 90,0,0
